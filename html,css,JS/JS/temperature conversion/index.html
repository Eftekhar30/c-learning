<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>temp conversion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form onsubmit="convert(); return false;">
            <h1>Temperature Conversion</h1>
            <input type="number" id="textbox" value="0"><br>

            <input type="radio" id="toF" name="unit">
            <label for="toF">C -> F</label><br>

            <input type="radio" id="toC" name="unit">
            <label for="toC">F -> C</label><br>

            <button type="submit">Convert</button>
            <p id="result"> select a unit </p>

    </form>

    <script src="index.js"></script>
</body>
</html>
